{% for class in LiveClass%}
<div class="border-left" style="margin-top:16px;" >
    <h4>
        {{class['title']}}
    </h4>
    <b>From: {{class['start_time']}}</b>
    <b>To: {{class['end_time']}}</b>
    <p>{{class['description']}}</p>
    <a href="{{class['link']}}" class="btn btn-primary">Join Now</a>
</div>

{% endfor %}
